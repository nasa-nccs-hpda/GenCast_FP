name: CI to Dockerhub - Multi-arch

on:
  release:
    types: [published]  # Trigger only when a release is created
  workflow_dispatch: # Build the branch selected in the Run workflow menu

permissions:
  contents: read

jobs:
  build-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source: ${{ steps.version.outputs.source }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolve build source and image tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            source="$RELEASE_TAG"
            ref="refs/tags/$RELEASE_TAG"
            tag="$RELEASE_TAG"
          else
            source="$SELECTED_NAME"
            ref="$SELECTED_REF"
            # Docker tags cannot contain slashes or other branch-name punctuation.
            tag="branch-$(printf '%s' "$source" | sed 's/[^a-zA-Z0-9_.-]/-/g' | cut -c1-115)"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ ]]; then
            echo "Invalid Docker image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building $ref as $tag"

  docker-amd:
    needs: [build-version]
    env:
      GenCastFP_TAG: ${{ needs.build-version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.build-version.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prune docker images and swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          docker image prune -a -f
          df -h

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ./requirements/Dockerfile
          pull: true
          push: true
          tags: nasanccs/gencast-fp:${{ env.GenCastFP_TAG }}-amd64
          build-args: |
            GenCastFP_TAG=${{ needs.build-version.outputs.source }}

  docker-arm:
    needs: [build-version]
    env:
      GenCastFP_TAG: ${{ needs.build-version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.build-version.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prune docker images and swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          docker image prune -a -f
          df -h

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./requirements/Dockerfile
          pull: true
          push: true
          tags: nasanccs/gencast-fp:${{ env.GenCastFP_TAG }}-arm64
          build-args: |
            GenCastFP_TAG=${{ needs.build-version.outputs.source }}

  manifest:
    needs: [build-version, docker-amd, docker-arm]
    env:
      GenCastFP_TAG: ${{ needs.build-version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract per-platform digests
        run: |
          AMD_DIGEST=$(docker buildx imagetools inspect nasanccs/gencast-fp:${{ env.GenCastFP_TAG }}-amd64 \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')
          ARM_DIGEST=$(docker buildx imagetools inspect nasanccs/gencast-fp:${{ env.GenCastFP_TAG }}-arm64 \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "arm64"}}{{.Digest}}{{end}}{{end}}')
          echo "AMD_DIGEST=$AMD_DIGEST" >> $GITHUB_ENV
          echo "ARM_DIGEST=$ARM_DIGEST" >> $GITHUB_ENV

      - name: Create and push manifest
        run: |
          # latest -> amd64 and arm64
          docker manifest create nasanccs/gencast-fp:latest \
            nasanccs/gencast-fp@${AMD_DIGEST} \
            nasanccs/gencast-fp@${ARM_DIGEST}
          docker manifest push nasanccs/gencast-fp:latest

          # version tag -> amd64 and arm64
          docker manifest create nasanccs/gencast-fp:${{ env.GenCastFP_TAG }} \
            nasanccs/gencast-fp@${AMD_DIGEST} \
            nasanccs/gencast-fp@${ARM_DIGEST}
          docker manifest push nasanccs/gencast-fp:${{ env.GenCastFP_TAG }}
